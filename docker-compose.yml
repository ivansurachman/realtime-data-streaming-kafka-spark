services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    container_name: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"   # akses dari host (producer)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,HOST://:9092
      # kafka:29092 -> antar container | localhost:9092 -> host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:                   # buat 3 topic lalu selesai
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in ${TOPIC_RAW} ${TOPIC_VALID} ${TOPIC_DLQ}; do
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $$t --bootstrap-server kafka:29092
        done

  kafbat-ui:                    # monitoring Kafka: http://localhost:${KAFBAT_UI_PORT:-8080}
    image: ${KAFBAT_IMAGE:-ghcr.io/kafbat/kafka-ui:v1.3.0}
    container_name: kafbat-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFBAT_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_INTERNAL:-kafka:29092}

  spark:
    build: ./streaming
    container_name: spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ivy-cache:/root/.ivy2   # cache jar spark-sql-kafka, biar restart tidak download ulang

volumes:
  ivy-cache:
